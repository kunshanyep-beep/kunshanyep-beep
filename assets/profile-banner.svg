<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">@kunshanyep-beep — Open-source engineering</title>
  <desc id="description">A developer profile banner focused on reliable tooling, terminal workflows, performance, and deterministic testing.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426" />
      <stop offset="0.52" stop-color="#102C4C" />
      <stop offset="1" stop-color="#25134A" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#A78BFA" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.34" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.32" />
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)" />
  <rect width="1200" height="360" rx="28" fill="url(#grid)" />
  <circle cx="198" cy="16" r="260" fill="url(#glowCyan)" />
  <circle cx="1070" cy="332" r="300" fill="url(#glowViolet)" />
  <path d="M0 313C204 250 376 349 581 296C809 237 959 261 1200 177V360H0Z" fill="#38BDF8" fill-opacity="0.035" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="70" y="80" fill="#7DD3FC" font-size="18" font-weight="700" letter-spacing="4">OPEN-SOURCE ENGINEERING</text>
    <rect x="70" y="101" width="500" height="5" rx="2.5" fill="url(#accent)" />
    <text x="70" y="171" fill="#F8FAFC" font-size="47" font-weight="750">@kunshanyep-beep</text>
    <text x="72" y="218" fill="#CBD5E1" font-size="22">Reliable developer tools · Terminal workflows</text>
    <text x="72" y="253" fill="#CBD5E1" font-size="22">Performance evidence · Deterministic testing</text>

    <g font-size="14" font-weight="650">
      <rect x="70" y="286" width="104" height="32" rx="16" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.55" />
      <text x="122" y="307" fill="#BAE6FD" text-anchor="middle">TypeScript</text>
      <rect x="186" y="286" width="74" height="32" rx="16" fill="#8B5CF6" fill-opacity="0.2" stroke="#A78BFA" stroke-opacity="0.55" />
      <text x="223" y="307" fill="#DDD6FE" text-anchor="middle">Bun</text>
      <rect x="272" y="286" width="88" height="32" rx="16" fill="#14B8A6" fill-opacity="0.2" stroke="#2DD4BF" stroke-opacity="0.55" />
      <text x="316" y="307" fill="#99F6E4" text-anchor="middle">SQLite</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="55" width="370" height="250" rx="18" fill="#07111F" stroke="#64748B" stroke-opacity="0.38" />
    <rect x="760" y="55" width="370" height="42" rx="18" fill="#162337" />
    <rect x="760" y="79" width="370" height="18" fill="#162337" />
    <circle cx="786" cy="76" r="6" fill="#FB7185" />
    <circle cx="806" cy="76" r="6" fill="#FBBF24" />
    <circle cx="826" cy="76" r="6" fill="#4ADE80" />
    <text x="945" y="81" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">engineering.log</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <text x="790" y="132" fill="#38BDF8">$</text>
      <text x="812" y="132" fill="#E2E8F0">reproduce --minimal</text>
      <text x="790" y="169" fill="#4ADE80">✓</text>
      <text x="812" y="169" fill="#CBD5E1">regression test added</text>
      <text x="790" y="206" fill="#4ADE80">✓</text>
      <text x="812" y="206" fill="#CBD5E1">performance measured</text>
      <text x="790" y="243" fill="#4ADE80">✓</text>
      <text x="812" y="243" fill="#CBD5E1">CI checks passing</text>
      <text x="790" y="280" fill="#A78BFA">→</text>
      <text x="812" y="280" fill="#F8FAFC">ship a focused patch</text>
    </g>
  </g>
</svg>
